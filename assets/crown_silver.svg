      <linearGradient id="silver_base_base" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F4F7FA"/>
        <stop offset="0.28" stop-color="#C7CED6"/>
        <stop offset="0.70" stop-color="#70757C"/>
        <stop offset="1" stop-color="#41464D"/>
      </linearGradient>
      <radialGradient id="silver_base_gem" cx="36%" cy="28%" r="72%">
