        <clipPath id="silver_magic_clip"><path d="M122 320 L116 228 L162 236 L192 180 L220 210 L256 150 L292 210 L320 180 L350 236 L396 228 L390 320 Q324 306 256 310 Q188 306 122 320 Z"/><path d="M132 320 C170 326 212 332 256 332 C300 332 342 326 380 320 L374 350 H138 Z"/></clipPath>
        
