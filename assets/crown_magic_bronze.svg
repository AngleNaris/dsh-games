        <clipPath id="bronze_magic_clip"><path d="M132 320 L126 238 L172 246 L200 198 L228 218 L256 180 L284 218 L312 198 L340 246 L386 238 L380 320 Q320 308 256 312 Q192 308 132 320 Z"/><path d="M142 320 C178 324 216 328 256 328 C296 328 334 324 370 320 L366 348 H146 Z"/></clipPath>
        
