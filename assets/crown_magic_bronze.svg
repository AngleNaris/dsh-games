<path d="M256 276 L276 296 L256 318 L236 296 Z" fill="url(#bronze_magic_gem)" stroke="#3A1B12" stroke-width="5.8" stroke-linejoin="round"/>
<path d="M256 284 L266 296 L256 308 L246 296 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.60" stroke-width="3.4" stroke-linejoin="round"/>

    <g clip-path="url(#bronze_magic_clip)" pointer-events="none">
      <g filter="url(#bronze_magic_magicGlow)">
        <g transform="rotate(-16 256 256)">
          <rect x="-420" y="-80" width="160" height="720" rx="80" fill="url(#bronze_magic_sweep)" opacity="0.95">
            <animate attributeName="x" values="-420;-420;560" dur="6.2s" repeatCount="indefinite"/>
          </rect>
          <rect x="-640" y="-100" width="100" height="760" rx="50" fill="url(#bronze_magic_sweepSoft)" opacity="0.68">
            <animate attributeName="x" values="-640;-640;520" dur="7.8s" begin="1.3s" repeatCount="indefinite"/>
