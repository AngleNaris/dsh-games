        <path d="M142 320 C178 324 216 328 256 328 C296 328 334 324 370 320 L366 348 H146 Z" fill="url(#bronze_magic_base)" stroke="#3A1B12" stroke-width="6.2" stroke-linejoin="round"/>
        <path d="M164 334 C194 338 224 340 256 340 C288 340 318 338 348 334" fill="none" stroke="#E0A06C" stroke-opacity="0.70" stroke-width="4.4" stroke-linecap="round"/>
