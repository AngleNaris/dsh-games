# dsh-games bundle patch: inserts its plugin row into the web plugin roster.
# The bundle is the official dsh plugin shape — install into a dsh profile with
#   dsh plugin --profile web add link:<this repo>
# The single row mounts BOTH halves: the host side (token ledger, room store,
# /api/games/* routes) and the browser side (floating DeepSeek-whale pet with
# hats, nickname + room UI, settings card).
- insert:
    - id: games
      name: '@linxin666/dsh-games'
